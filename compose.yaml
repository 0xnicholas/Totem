# Totem — Docker Compose (v1)
#
# `docker compose up` starts Postgres, applies migrations, and serves the
# admin API on http://localhost:3000. Copy .env.example to .env to override.

services:
  db:
    # postgres:18+ requires the mount at /var/lib/postgresql (not .../data);
    # image and mount point must move together.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-totem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-totem}
      POSTGRES_DB: ${POSTGRES_DB:-totem}
    # 5433 by default: 5432 clashes with a local Postgres.app install on macOS.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - totem_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-totem}:${POSTGRES_PASSWORD:-totem}@db:5432/${POSTGRES_DB:-totem}
      # Dev default only — set a real admin key in .env (T3).
      TOTEM_ADMIN_KEY: ${TOTEM_ADMIN_KEY:-tt_dev_admin_change_me}
      PORT: 3000
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  totem_db_data:
