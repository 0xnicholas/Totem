# Totem — Docker Compose (v1)
#
# `docker compose up` starts Postgres + Redis, applies migrations once via
# the one-shot `migrate` service, then serves the admin API on
# http://localhost:3000. Copy .env.example to .env to override.

services:
  db:
    # postgres:18+ requires the mount at /var/lib/postgresql (not .../data);
    # image and mount point must move together.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-totem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-totem}
      POSTGRES_DB: ${POSTGRES_DB:-totem}
    # 5433 by default: 5432 clashes with a local Postgres.app install on macOS.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - totem_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    # One-shot migration runner: applies pending migrations exactly once,
    # then exits. `api` waits for it (service_completed_successfully), so
    # multi-replica deploys never race on migrate:up (T2 follow-up).
    build: .
    command: ["npm", "run", "migrate:up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-totem}:${POSTGRES_PASSWORD:-totem}@db:5432/${POSTGRES_DB:-totem}
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:8.0-alpine
    # 6380 by default: 6379 clashes with local Redis installs on macOS (same
    # reasoning as POSTGRES_PORT). Data persists in the redis_data volume.
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-totem}:${POSTGRES_PASSWORD:-totem}@db:5432/${POSTGRES_DB:-totem}
      # Dev defaults only — set real values in .env (T3 admin key, T6 token key).
      TOTEM_ADMIN_KEY: ${TOTEM_ADMIN_KEY:-tt_dev_admin_change_me}
      TOTEM_TOKEN_ENC_KEY: ${TOTEM_TOKEN_ENC_KEY:-tt_dev_token_enc_change_me_0123456789}
      FEISHU_BASE_URL: ${FEISHU_BASE_URL:-https://open.feishu.cn}
      PORT: 3000
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  totem_db_data:
  redis_data:
