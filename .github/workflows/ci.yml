name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: totem
          POSTGRES_PASSWORD: totem
          POSTGRES_DB: totem
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U totem -d totem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://totem:totem@localhost:5433/totem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # OpenAPI drift gate (T26): regenerate the committed snapshot and fail
      # on any difference, so a registry change that forgets to update
      # openapi.json turns the PR red — the diff is visible in this step's
      # output and reviewable in the PR.
      - name: OpenAPI snapshot drift gate
        run: |
          npm run generate:openapi
          git diff --exit-code openapi.json
